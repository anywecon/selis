[package]
name = "selis-app"
description = "Selis — free, open-source PDF editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows.
name = "selis_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Release builds for scripts/measure-device.sh only: keeps WebView remote
# debugging (Chrome DevTools Protocol) on so the script can time the first page
# and drive the scroll. Never enabled for shipped builds.
measure = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "~2.7.2", features = [] }

[dependencies]
base64 = "0.23.1"
selis-core = { workspace = true, features = ["specta"] }
selis-pdfops.workspace = true
selis-transfer = { path = "../../../crates/selis-transfer" }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { version = "~2.12.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "~2.8.2"
tauri-plugin-fs = "~2.7.0"
tauri-specta.workspace = true
tokio = { version = "1.53.2", default-features = false, features = ["sync", "time"] }
# Device key in the OS secure storage (ADR 0011); Android uses DeviceKeyPlugin.kt.
keyring-core = "=1.0.1"
# Debug builds only (`debug_log.rs`): transfer diagnostics to a file in the app cache.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile.workspace = true
# MockRuntime for command tests (no extra crates).
tauri = { version = "~2.12.3", features = ["protocol-asset", "test"] }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
# Same version as wry, whose JNI handle we receive.
jni = "=0.21.1"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain", "protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "=1.1.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "ios")'.dependencies]
# sysinfo does not build for iOS; NSProcessInfo.physicalMemory is the native source.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[lints]
workspace = true
